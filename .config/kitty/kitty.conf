# kitty — ported from ~/.config/termite/config (2026-11-24)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

scrollback_lines 10000
cursor_shape     beam
cursor_blink_interval 0
enable_audio_bell no
background_opacity 0.90
dynamic_background_opacity yes
confirm_os_window_close 0
window_padding_width 4
copy_on_select clipboard
strip_trailing_spaces smart
open_url_with default
linux_display_server auto

# Dracula-ish palette from termite
foreground #f8f8f2
background #282a36
cursor     #f8f8f2
selection_foreground #282a36
selection_background #f8f8f2
color0  #000000
color8  #4d4d4d
color1  #ff5555
color9  #ff6e67
color2  #50fa7b
color10 #5af78e
color3  #f1fa8c
color11 #f4f99d
color4  #bd93f9
color12 #caa9fa
color5  #ff79c6
color13 #ff92d0
color6  #8be9fd
color14 #9aedfe
color7  #bfbfbf
color15 #e6e6e6

# Mouse: select = copy (copy_on_select above), right-click = paste clipboard, middle-click = paste selection
mouse_map right press ungrabbed paste_from_clipboard
mouse_map middle release ungrabbed paste_from_selection
# keyboard copy/paste: Ctrl+Shift+C / Ctrl+Shift+V (kitty defaults), plus plain Ctrl+Shift+Insert
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# accent colours follow the current workspace wallpaper (written by ~/.config/hypr/wallpaper.sh)
include accent.conf
