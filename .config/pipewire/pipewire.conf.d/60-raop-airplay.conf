# Discover AirPlay receivers (e.g. the WiiM Amp "Den") and expose them as PipeWire output sinks.
# 2026-11-25: never suspend the AirPlay sink. Every suspend tears the RTSP session down, and the resume
# re-handshakes (timestamp mismatches, "missing timeout" in the log) — that is where the drop-outs came from.
context.modules = [
    { name = libpipewire-module-raop-discover
      args = {
          stream.rules = [
              {   matches = [ { raop.ip = "~.*" } ]
                  actions = {
                      create-stream = {
                          stream.props = {
                              session.suspend-timeout-seconds = 0
                              node.pause-on-idle = false
                          }
                      }
                  }
              }
          ]
      }
    }
]
