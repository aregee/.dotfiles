# cava profile for the Waybar module (~/.config/waybar/cava.sh), 2026-11-25
[general]
bars = 12
framerate = 30
autosens = 1
sleep_timer = 5
[input]
method = pipewire
source = auto
[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
[smoothing]
noise_reduction = 70
