$accent = rgb(f4b771)    # rewritten by wallpaper.sh: follows the workspace wallpaper
$accent2 = rgb(a3a8e6)

animations {
    enabled = true
    animation = fadeIn, 1, 4, default
    animation = fadeOut, 1, 4, default
    animation = inputFieldDots, 1, 2, default
}
general {
    hide_cursor = true
    ignore_empty_input = true
}
background {
    monitor =
    path = /home/aregee/.config/hypr/current-wallpaper
    blur_passes = 3
    blur_size = 6
}
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = $accent
    inner_color = rgb(282a36)
    font_color = rgb(f8f8f2)
    fade_on_empty = false
    placeholder_text = <span foreground="##6272a4">Password…</span>
    fail_text = <span foreground="##ff5555">$FAIL</span>
    position = 0, -80
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb(f8f8f2)
    font_size = 96
    font_family = Inter
    position = 0, 130
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER @ deus-orion
    color = rgb(6272a4)
    font_size = 18
    font_family = Inter
    position = 0, 22
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgb(6272a4)
    font_size = 16
    font_family = Inter
    position = 0, 60
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:3000] ~/.config/hypr/lock-music.sh
    color = $accent2
    font_size = 13
    font_family = Inter
    position = 0, 48
    halign = center
    valign = bottom
}
